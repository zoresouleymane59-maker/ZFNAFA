<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<script>try{if(localStorage.getItem("zfnafa.theme")==="light"){document.documentElement.setAttribute("data-theme","light")}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ZFNAFA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: une colonne mobile, résumé du jour en haut, barre d'onglets fixe en bas avec le bouton "Vente" au centre */
:root {
  --bg: #0A0A0A;
  --surface: #151515;
  --fg: #F4F1E8;
  --muted: #A8A296;
  --line: #2C2C2C;
  --accent: #FFC21A;
  --accent-fg: #0A0A0A;
  --accent-ink: #FFC21A;
  --red: #E0252C;
  --red-fg: #FFFFFF;
  --debt: #FF6A5E;
  --debt-bg: #3B1613;
  --ok-bg: #2B2406;
  --shadow: 0 -6px 24px rgba(0, 0, 0, .6);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F6F2E9; --surface: #FFFFFF; --fg: #1A1A1A; --muted: #5B574D; --line: #DDD6C6;
  --accent: #FFC21A; --accent-fg: #0A0A0A; --accent-ink: #8A5300;
  --red: #C81E25; --red-fg: #FFFFFF; --debt: #BA2418; --debt-bg: #FBE3E0; --ok-bg: #FFF0C2;
  --shadow: 0 -6px 24px rgba(0, 0, 0, .12);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 16px 120px;
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; }
header.top .brand { white-space: nowrap; }
header.top h1 { font-size: 1.6rem; letter-spacing: -.01em; }
header.top .date { color: var(--muted); font-size: .85rem; text-transform: capitalize; text-align: right; }

.demo { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: .88rem; color: var(--muted); }
.demo button { border: 0; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 8px 12px; font-weight: 600; white-space: nowrap; }

.hero { background: linear-gradient(150deg, var(--red), #9B1319); color: var(--red-fg); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.hero .lbl { font-size: .85rem; opacity: .85; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.hero .big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
.hero .big small { font-size: 1rem; font-weight: 600; opacity: .85; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat .lbl { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.stat .val { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; overflow-wrap: anywhere; }
.stat.debt .val { color: var(--debt); }

section.block { display: flex; flex-direction: column; gap: 8px; }
section.block > h2 { font-size: 1.1rem; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; background: none; border: 0; text-align: left; min-width: 0; }
.row + .row { border-top: 1px solid var(--line); }
button.row:hover { background: var(--bg); }
.row .main { flex: 1; min-width: 0; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.amt { font-weight: 600; white-space: nowrap; }
.pill { border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.pill.debt { background: var(--debt-bg); color: var(--debt); }
.pill.ok { background: var(--ok-bg); color: var(--accent-ink); }
.empty { color: var(--muted); padding: 16px 14px; font-size: .92rem; }
.neg { color: var(--debt); }
.pos { color: var(--accent-ink); }

.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 600; background: var(--accent); color: var(--accent-fg); text-align: center; text-decoration: none; display: inline-block; }
.btn.alt { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.wa { background: #1FA855; color: #fff; }
.btn.small { padding: 8px 12px; font-size: .88rem; border-radius: 9px; }

nav.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
nav.bar .in { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: 1fr 1fr 1fr auto; align-items: center; gap: 4px; }
.linklike { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; }
.linklike .name { font-weight: 600; overflow-wrap: anywhere; }
.linklike .sub { color: var(--muted); font-size: .85rem; }
.stat .sub { color: var(--muted); font-size: .82rem; }
.pill.low { background: var(--debt-bg); color: var(--debt); }
.qty { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.field textarea { min-height: 110px; resize: vertical; line-height: 1.4; }
.hint { color: var(--muted); font-size: .85rem; }
.gd { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.gd + .gd { margin-top: 8px; }
.gd summary { cursor: pointer; padding: 13px 14px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.gd summary::-webkit-details-marker { display: none; }
.gd summary::after { content: "+"; font-family: var(--font-display); font-size: 1.3rem; color: var(--accent-ink); }
.gd[open] summary::after { content: "−"; }
.gd .body { padding: 0 14px 14px; color: var(--fg); font-size: .95rem; display: flex; flex-direction: column; gap: 8px; }
.gd .body ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.gd .body p { margin: 0; color: var(--muted); }
.contact { background: var(--ok-bg); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.contact b { font-family: var(--font-display); }
.contact .nb { font-weight: 600; user-select: all; }
.trialbar { width: 100%; background: var(--ok-bg); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: .9rem; text-align: left; }
.price { background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.price .amount { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; color: var(--accent-ink); line-height: 1; }
.price .amount small { font-size: 1rem; color: var(--muted); font-weight: 600; }
.price ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: .92rem; display: flex; flex-direction: column; gap: 3px; }
.idrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.idrow .nb { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: .06em; user-select: all; }
.undo { background: none; border: 0; padding: 2px 0; color: var(--muted); font-size: .8rem; text-decoration: underline; margin-top: 2px; align-self: flex-start; }
.foot { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; padding-top: 4px; }
.banner { background: var(--debt-bg); color: var(--debt); border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: .9rem; }
.row .main { display: flex; flex-direction: column; }
.bizcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--accent); border-radius: 16px; padding: 14px 16px; cursor: pointer; font: inherit; }
.bizcard > span:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bizcard .lbl { color: var(--accent-ink); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.bizcard .big { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; overflow-wrap: anywhere; }
.bizcard .sub { color: var(--muted); font-size: .85rem; }
.bizcard .go { color: var(--accent-ink); font-weight: 700; white-space: nowrap; }
.todaymark { background: var(--ok-bg); color: var(--accent-ink); border-radius: 6px; padding: 1px 6px; font-size: .75rem; font-weight: 600; margin-left: 6px; }
.tab { background: none; border: 0; padding: 10px 6px; font-weight: 600; color: var(--muted); border-radius: 10px; }
.tab[aria-selected="true"] { color: var(--accent-ink); background: var(--ok-bg); }
.fab { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 700; font-family: var(--font-display); font-size: 1rem; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet > * { flex-shrink: 0; }
.sheet .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet .head h2 { font-size: 1.25rem; }
.x { background: var(--bg); border: 0; border-radius: 999px; width: 36px; height: 36px; font-size: 1.1rem; flex: none; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: .85rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.field input.bigin { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 10px 6px; border: 1px solid var(--line); border-radius: 10px; font-size: .88rem; font-weight: 600; color: var(--fg); background: var(--bg); cursor: pointer; }
.seg input:checked + label { background: var(--accent); color: var(--accent-fg); border-color: var(--accent-ink); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: var(--debt); font-weight: 600; font-size: .9rem; min-height: 1.2em; }
.rest { background: var(--debt-bg); color: var(--debt); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.rest.zero { background: var(--ok-bg); color: var(--accent-ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions > * { flex: 1 1 140px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
/* Page d'accueil */
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; }
.landing { display: flex; flex-direction: column; gap: 22px; }
.landing .lead { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
.landing h1 { font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1.04; letter-spacing: -.02em; }
.landing h1 em { font-style: normal; color: var(--accent-ink); }
.landing .sub { color: var(--muted); font-size: 1.08rem; max-width: 34ch; }
.landing .cta { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.landing .cta .btn { font-size: 1.05rem; padding: 15px 22px; }
.landing .note { font-size: .85rem; color: var(--muted); }
.sample { position: relative; background: linear-gradient(150deg, var(--red), #9B1319); color: var(--red-fg); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sample .tag { position: absolute; top: 12px; right: 14px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .8; font-weight: 600; }
.sample .lbl { font-size: .8rem; opacity: .85; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.sample .big { font-family: var(--font-display); font-size: 2.1rem; font-weight: 700; line-height: 1.1; }
.sample .mini { background: rgba(255, 255, 255, .14); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: .92rem; }
.benefits { display: grid; grid-template-columns: 1fr; gap: 10px; }
.benefit { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.benefit h3 { font-size: 1.05rem; }
.benefit p { margin: 0; color: var(--muted); font-size: .95rem; }
.steps { display: flex; flex-direction: column; gap: 10px; counter-reset: s; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; }
.steps li::before { content: counter(s); flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ok-bg); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; display: grid; place-items: center; }
.steps b { display: block; }
.steps span { color: var(--muted); font-size: .93rem; }
.landing h2 { font-size: 1.3rem; }
.band { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .88rem; font-weight: 600; background: var(--bg); }
.hdr-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.kebab { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; flex: none; padding: 0; }
.menu-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 10; display: flex; justify-content: flex-end; align-items: flex-start; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 16px; }
.menu { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: min(330px, 100%); max-height: 100%; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 12px 40px rgba(0, 0, 0, .6); }
.menu .who { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; background: var(--bg); text-align: left; border: 0; width: 100%; }
.menu .who .txt { min-width: 0; display: flex; flex-direction: column; }
.menu .who .nm { font-weight: 700; overflow-wrap: anywhere; }
.menu .who .idl { color: var(--muted); font-size: .85rem; }
.menu .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 12px; border-radius: 10px; background: none; border: 0; text-align: left; width: 100%; font-weight: 600; color: var(--fg); text-decoration: none; }
.menu .item:hover { background: var(--bg); }
.menu .item .pill { white-space: normal; text-align: right; }
.menu .item > span:first-child { flex: none; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--red); color: #FFC21A; font-family: var(--font-display); font-weight: 700; display: grid; place-items: center; flex: none; font-size: 1.05rem; }
.avatar.big { width: 64px; height: 64px; font-size: 1.5rem; }
.prow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; }
.prow + .prow { border-top: 1px solid var(--line); }
.prow .k { color: var(--muted); font-size: .85rem; flex: none; }
.prow .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
.kebab { position: relative; }
.kebab.has::after { content: ""; position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); border: 2px solid var(--surface); }
.badge { background: var(--red); color: #fff; border-radius: 999px; font-size: .75rem; font-weight: 700; padding: 2px 8px; white-space: nowrap; }
.cdbox { background: var(--surface); border: 1px solid var(--accent); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.cdbox .ttl { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.cdgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cdn { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 2px; text-align: center; min-width: 0; }
.cdn b { display: block; font-family: var(--font-display); font-size: 1.9rem; line-height: 1.05; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.cdn span { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.bar2 { height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 1s linear; }
.cdbox.urgent, .cdbox.last { border-color: var(--debt); }
.cdbox.urgent .cdn b, .cdbox.last .cdn b { color: var(--debt); }
.cdbox.urgent .bar2 i, .cdbox.last .bar2 i { background: var(--debt); }
.trialbar.urgent, .trialbar.last { background: var(--debt-bg); color: var(--debt); border-color: var(--debt); }
.msg { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.msg + .msg { border-top: 1px solid var(--line); }
.msg.new { box-shadow: inset 3px 0 0 var(--red); }
.msg .mt { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.msg .mt b { overflow-wrap: anywhere; }
.msg .md { color: var(--muted); font-size: .78rem; white-space: nowrap; }
.msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
.msg .from { color: var(--accent-ink); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.msg .btn { align-self: flex-start; margin-top: 4px; }
@media (max-width: 360px) { .cdn b { font-size: 1.5rem; } .cdbox { padding: 12px; } }
.voice { display: flex; flex-direction: column; gap: 6px; }
.btn.rec { background: var(--red); color: #fff; border-color: var(--red); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 140px; }
.bcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0; }
.bcol i { display: block; width: 100%; max-width: 34px; background: var(--accent); border-radius: 6px 6px 2px 2px; }
.bcol span { color: var(--muted); font-size: .7rem; text-transform: capitalize; }
.bcol b { font-size: .68rem; font-weight: 600; min-height: 1em; }
.dots { display: flex; gap: 14px; justify-content: center; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); }
.dots i.on { background: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; justify-content: center; }
.key { height: 64px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; padding: 0; }
.key.ph { visibility: hidden; }
.mini-acts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 2px; }
.mini-acts .undo { margin-top: 0; }
a.undo { color: var(--accent-ink); }
.banner.neutral { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.offline-note { display: none; }
body.is-off .offline-note { display: block; }
@media (prefers-reduced-motion: no-preference) { .btn.rec { animation: pulse 1s infinite; } @keyframes pulse { 50% { opacity: .6; } } }
.landing > .brand { font-size: 1.5rem; letter-spacing: .02em; }
.kicker { color: var(--accent-ink); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
.langrow { display: flex; gap: 6px; flex-wrap: wrap; }
.langrow .lg { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
.langrow .lg.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent-ink); }

@media (min-width: 520px) { .benefits { grid-template-columns: repeat(2, 1fr); } }

}

<body>

<div id="toast" class="toast" hidden></div>

<script>
(function () {
  var KEY = "moncahier.v1";
  var storageOK = true;
  /* Numéro WhatsApp du propriétaire de ZFNAFA, au format international sans + (ex : 22670123456). Vide : le bouton « Nous écrire » est caché. */
  var OWNER_WA = "22658286997";
  var OWNER_SHOW = "+226 58 28 69 97";
  function ownerLink(msg) { return "https://wa.me/" + OWNER_WA + "?text=" + encodeURIComponent(msg || "Bonjour, j'ai une question sur ZFNAFA."); }
  function contactBlock() {
    return '<div class="contact"><b>Besoin d\'explications ?</b><span>Écris-nous sur WhatsApp, nous te répondons et nous t\'aidons à démarrer.</span>' +
      '<span class="nb num">' + OWNER_SHOW + '</span><a class="btn wa" href="' + ownerLink() + '" target="_blank" rel="noopener">Nous écrire sur WhatsApp</a></div>';
  }
  var MODES = ["Espèces", "Orange Money", "Moov Money"];
  var state = load();
  var INTRO_KEY = "moncahier.intro";
  function introSeen() { try { return localStorage.getItem(INTRO_KEY) === "1"; } catch (e) { return false; } }
  function markIntro() { try { localStorage.setItem(INTRO_KEY, "1"); } catch (e) {} }
  var view = introSeen() ? "today" : "intro";
  var query = "";
  function logo(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 48 48" role="img" aria-label="ZF"><rect width="48" height="48" rx="10" style="fill:var(--red)"/><text x="24" y="32" text-anchor="middle" font-family="Bricolage Grotesque, Trebuchet MS, sans-serif" font-weight="700" font-size="22" letter-spacing="-1" style="fill:var(--accent)">ZF</text></svg>';
  }
  function intro() {
    return '<div class="landing">' +
      '<div class="brand">' + logo(36) + 'ZFNAFA</div>' + langRow() +
      '<div class="lead"><span class="kicker">Le cahier de ton commerce</span><h1>Fini les <em>dettes oubliées.</em></h1>' +
      '<p class="sub" style="margin:0">Note tes ventes, ce que chaque client te doit et ton stock. Relance les clients sur WhatsApp en un geste.</p></div>' +
      '<div class="cta"><button class="btn" data-act="start">Essayer gratuitement</button><span class="note">7 jours gratuits, puis 3 000 FCFA par mois. Rien à installer.</span></div>' +
      '<div class="sample" aria-label="Exemple d\'écran"><span class="tag">Exemple</span><div><div class="lbl">Ventes du jour</div><div class="big num">36 500 FCFA</div></div>' +
      '<div class="mini"><span>Awa Ouédraogo</span><span class="num">doit 7 500 FCFA</span></div>' +
      '<div class="mini"><span>Boukary Sawadogo</span><span class="num">doit 8 000 FCFA</span></div></div>' +
      '<div class="benefits">' +
      '<div class="benefit"><h3>Vendre en 2 clics</h3><p>Le montant, le client, c\'est noté. Même dans la foule du marché.</p></div>' +
      '<div class="benefit"><h3>Dettes à jour</h3><p>Tu vois d\'un coup d\'œil qui te doit combien, du plus gros au plus petit.</p></div>' +
      '<div class="benefit"><h3>Rappel WhatsApp</h3><p>Un message poli est prêt à envoyer, avec le montant exact.</p></div>' +
      '<div class="benefit"><h3>Stock sous contrôle</h3><p>Note chaque entrée et chaque livraison. Tu sais ce qu\'il reste, et tu es prévenu avant la rupture.</p></div>' +
      '<div class="benefit"><h3>Dicte tes ventes</h3><p>Dis le montant et le nom du client, la vente se remplit toute seule.</p></div>' +
      '<div class="benefit"><h3>Marche sans internet</h3><p>Installe l\'application sur ton téléphone. Elle marche même quand le réseau est coupé.</p></div>' +
      '<div class="benefit"><h3>Bilan et reçus</h3><p>Vois tes chiffres du jour, de la semaine, et envoie un reçu par WhatsApp.</p></div>' +
      '<div class="benefit"><h3>Code secret</h3><p>Garde tes comptes privés avec un code à 4 chiffres.</p></div></div>' +
      '<h2>Comment ça marche</h2>' +
      '<ol class="steps"><li><div><b>Note la vente</b><span>Montant, client, mode de paiement.</span></div></li>' +
      '<li><div><b>Indique ce qui est payé</b><span>Le reste devient automatiquement une dette.</span></div></li>' +
      '<li><div><b>Relance quand il faut</b><span>Un geste, et le client reçoit ton rappel sur WhatsApp.</span></div></li></ol>' +
      '<div class="band"><h2>Pensé pour ton commerce et ton entreprise</h2><div class="chips"><span class="chip">Espèces</span><span class="chip">Orange Money</span><span class="chip">Moov Money</span><span class="chip">En FCFA</span><span class="chip">En français</span></div>' +
      '<span class="note">Commerçants, boutiques, marchés, restaurants, quincailleries, garages et toutes les entreprises.</span></div>' +
      '<div class="band"><h2>Tarif</h2><div class="price"><div class="amount">3 000 FCFA<small> / mois</small></div><span class="note">' + TRIAL_DAYS + " jours d'essai gratuit, puis 3 000 FCFA par mois. Paiement par Orange Money ou Wave.</span></div></div>" +
      '<div class="cta"><button class="btn" data-act="start">Ouvrir mon cahier</button><button class="btn alt" data-act="guide">Voir le guide d\'utilisation</button></div>' +
      contactBlock() + "</div>";
  }

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function dayISO(offset) { var d = new Date(); d.setDate(d.getDate() + (offset || 0)); d.setHours(10, 0, 0, 0); return d.toISOString(); }
  function sample() {
    var c = [
      { id: "c1", name: "Awa Ouédraogo", phone: "70 12 34 56" },
      { id: "c2", name: "Boukary Sawadogo", phone: "76 45 67 89" },
      { id: "c3", name: "Mariam Traoré", phone: "65 98 76 54" },
      { id: "c4", name: "Salif Kaboré", phone: "" }
    ];
    var t = [
      { id: uid(), at: dayISO(-6), clientId: "c1", type: "sale", total: 12500, paid: 5000, mode: "Espèces", note: "Riz 25 kg + huile" },
      { id: uid(), at: dayISO(-4), clientId: "c2", type: "sale", total: 8000, paid: 0, mode: "Espèces", note: "Sucre, savon" },
      { id: uid(), at: dayISO(-3), clientId: "c3", type: "sale", total: 4500, paid: 4500, mode: "Orange Money", note: "" },
      { id: uid(), at: dayISO(-2), clientId: "c1", type: "payment", total: 0, paid: 2000, mode: "Orange Money", note: "Remboursement" },
      { id: uid(), at: dayISO(-1), clientId: "c4", type: "sale", total: 6000, paid: 3500, mode: "Moov Money", note: "" },
      { id: uid(), at: dayISO(0), clientId: "c3", type: "sale", total: 9500, paid: 9500, mode: "Espèces", note: "Tomates, oignons" },
      { id: uid(), at: dayISO(0), clientId: null, type: "sale", total: 2500, paid: 2500, mode: "Espèces", note: "" },
      { id: uid(), at: dayISO(0), clientId: "c2", type: "sale", total: 7000, paid: 2000, mode: "Espèces", note: "Pâtes, lait" }
    ];
    var st = sampleStock();
    return { demo: true, clients: c, tx: t, products: st.products, moves: st.moves, settings: { shop: "", template: "" } };
  }
  function sampleStock() {
    var products = [
      { id: "p1", name: "Riz 25 kg", unit: "sacs", min: 5 },
      { id: "p2", name: "Huile 5 L", unit: "bidons", min: 10 },
      { id: "p3", name: "Sucre", unit: "cartons", min: 4 },
      { id: "p4", name: "Savon", unit: "cartons", min: 3 }
    ];
    var moves = [
      { id: uid(), at: dayISO(-6), productId: "p1", type: "in", qty: 40, note: "Fournisseur Bobo" },
      { id: uid(), at: dayISO(-6), productId: "p2", type: "in", qty: 30, note: "Fournisseur Bobo" },
      { id: uid(), at: dayISO(-5), productId: "p3", type: "in", qty: 10, note: "" },
      { id: uid(), at: dayISO(-5), productId: "p4", type: "in", qty: 8, note: "" },
      { id: uid(), at: dayISO(-3), productId: "p1", type: "out", qty: 22, note: "Livraison grossiste", clientId: null },
      { id: uid(), at: dayISO(-3), productId: "p4", type: "out", qty: 6, note: "", clientId: null },
      { id: uid(), at: dayISO(-2), productId: "p2", type: "out", qty: 10, note: "", clientId: null },
      { id: uid(), at: dayISO(-1), productId: "p3", type: "out", qty: 4, note: "", clientId: null },
      { id: uid(), at: dayISO(0), productId: "p2", type: "in", qty: 20, note: "Réception du matin" },
      { id: uid(), at: dayISO(0), productId: "p3", type: "in", qty: 6, note: "" },
      { id: uid(), at: dayISO(0), productId: "p1", type: "out", qty: 10, note: "Livraison", clientId: "c1" },
      { id: uid(), at: dayISO(0), productId: "p2", type: "out", qty: 14, note: "Livraison", clientId: "c3" }
    ];
    return { products: products, moves: moves };
  }
  function load() {
    try {
      var s = localStorage.getItem(KEY);
      if (s) {
        var raw = JSON.parse(s);
        var p = cleanState(raw);
        if (p) {
          if (raw && (!raw.products || !raw.moves) && p.demo) { var st = sampleStock(); p.products = st.products; p.moves = st.moves; }
          return p;
        }
      }
    } catch (e) {}
    return sample();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; } catch (e) { storageOK = false; } }
  function cleanState(p) {
    if (!p || typeof p !== "object" || !Array.isArray(p.clients) || !Array.isArray(p.tx)) return null;
    var ok = function (a) { return (Array.isArray(a) ? a : []).filter(function (x) { return x && typeof x.id === "string"; }); };
    return {
      demo: !!p.demo,
      clients: ok(p.clients).map(function (c) { return { id: c.id, chg: Math.max(0, +c.chg || 0), name: String(c.name || "Client"), phone: String(c.phone || ""), due: /^\d{4}-\d{2}-\d{2}$/.test(c.due || "") ? c.due : "" }; }),
      tx: ok(p.tx).map(function (t) { return { id: t.id, at: t.at, clientId: t.clientId || null, type: t.type === "payment" ? "payment" : "sale", total: Math.max(0, +t.total || 0), paid: Math.max(0, +t.paid || 0), mode: t.mode || "Espèces", note: String(t.note || ""), productId: t.productId || null, pqty: +t.pqty || 0, chg: Math.max(0, +t.chg || 0), src: String(t.src || ""), ref: String(t.ref || "") }; }),
      products: ok(p.products).map(function (x) { return { id: x.id, name: String(x.name || "Produit"), unit: String(x.unit || "unités"), min: Math.max(0, +x.min || 0) }; }),
      moves: ok(p.moves).map(function (m) { return { id: m.id, at: m.at, productId: m.productId, type: m.type === "out" ? "out" : "in", qty: Math.max(0, +m.qty || 0), note: String(m.note || ""), clientId: m.clientId || null, saleId: m.saleId || null }; }),
      lost: ok(p.lost).map(function (l) { return { id: l.id, at: l.at, amount: Math.max(0, +l.amount || 0), ref: String(l.ref || "") }; }),
      biz: {
        expenses: ok(p.biz && p.biz.expenses).map(function (e) { return { id: e.id, at: e.at, cat: String(e.cat || "Autre"), label: String(e.label || ""), amount: Math.max(0, +e.amount || 0), staffId: e.staffId || null }; }),
        staff: ok(p.biz && p.biz.staff).map(function (x) { return { id: x.id, name: String(x.name || "Employé"), role: String(x.role || ""), salary: Math.max(0, +x.salary || 0) }; }),
        orders: ok(p.biz && p.biz.orders).map(function (o) { return { id: o.id, at: o.at, ref: String(o.ref || ""), kind: String(o.kind || ""), note: String(o.note || ""), total: Math.max(0, +o.total || 0), step: Math.max(0, +o.step || 0), done: !!o.done, saleId: o.saleId || null }; })
      },
      settings: { shop: String((p.settings && p.settings.shop) || ""), template: String((p.settings && p.settings.template) || "") }
    };
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); }
  function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " FCFA"; }
  function num(v) { var n = parseInt(String(v).replace(/[^\d]/g, ""), 10); return isNaN(n) ? 0 : n; }
  function sameDay(iso) { var a = new Date(iso), b = new Date(); return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function dShort(iso) { return new Date(iso).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }); }
  function client(id) { return state.clients.filter(function (c) { return c.id === id; })[0]; }
  function debtOf(id) {
    return state.tx.reduce(function (s, t) {
      if (t.clientId !== id) return s;
      return s + (t.type === "sale" ? t.total - t.paid : -t.paid);
    }, 0);
  }
  function totalDebt() { return state.clients.reduce(function (s, c) { return s + Math.max(0, debtOf(c.id)); }, 0); }
  function toast(msg) {
    var el = document.getElementById("toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2200);
  }
  var DEFAULT_TPL = "Bonjour {prenom}, petit rappel : vous avez un solde de {montant} à régler{boutique}. Merci beaucoup !";
  function reminderText(c, debt) {
    var s = state.settings || {};
    var t = s.template || DEFAULT_TPL;
    var shop = s.shop ? " chez " + s.shop : "";
    return t.replace(/\{prenom\}/g, c.name.split(" ")[0]).replace(/\{montant\}/g, fmt(debt)).replace(/\{boutique\}/g, shop);
  }
  function waLink(c, debt) {
    var d = (c.phone || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.length === 8) d = "226" + d;
    return "https://wa.me/" + d + "?text=" + encodeURIComponent(reminderText(c, debt));
  }
  /* ---------- Stock ---------- */
  function product(id) { return state.products.filter(function (p) { return p.id === id; })[0]; }
  function stockOf(id) { return state.moves.reduce(function (s, m) { return m.productId === id ? s + (m.type === "in" ? m.qty : -m.qty) : s; }, 0); }
  function lowStock() { return state.products.filter(function (p) { return p.min > 0 && stockOf(p.id) <= p.min; }); }
  function todayStr() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
  function dateFromInput(v) {
    if (!v || v === todayStr()) return new Date().toISOString();
    var a = v.split("-"); return new Date(+a[0], +a[1] - 1, +a[2], 12).toISOString();
  }

  /* ---------- Rendu des pages ---------- */
  function render() {
    if (pinLocked) { document.querySelector("nav.bar").hidden = true; document.getElementById("app").innerHTML = pinScreen(); return; }
    var needSignup = view !== "intro" && !profile;
    var needStep = view !== "intro" && !!profile && profile.notified === false;
    var locked = view !== "intro" && !needSignup && !needStep && licStatus().state === "locked";
    document.querySelector("nav.bar").hidden = view === "intro" || needSignup || needStep || locked;
    if (view === "intro") { document.getElementById("app").innerHTML = intro(); return; }
    if (needSignup) { document.getElementById("app").innerHTML = signupScreen(); return; }
    if (needStep) { document.getElementById("app").innerHTML = lastStepScreen(); return; }
    if (locked) { document.getElementById("app").innerHTML = lockScreen(); return; }
    document.getElementById("tab-today").setAttribute("aria-selected", view === "today");
    document.getElementById("tab-clients").setAttribute("aria-selected", view === "clients");
    document.getElementById("tab-stock").setAttribute("aria-selected", view === "stock");
    var h ='<header class="top"><div class="brand">' + logo(30) + 'ZFNAFA</div><div class="hdr-right"><span class="date">' +
      new Date().toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long" }) + '</span><button class="kebab" data-act="menu" aria-label="Menu" aria-haspopup="menu">' + KEBAB + '</button></div></header>';
    h += '<div class="banner neutral offline-note">Pas d\'internet. ZFNAFA marche quand même : tes données sont dans ce téléphone.</div>';
    if (!storageOK) h += '<div class="banner">Ce navigateur ne peut pas garder tes données. Elles seront perdues à la fermeture. Fais une sauvegarde (menu ⋮ en haut à droite, puis Sauvegarde).</div>';
    var ei = endInfo();
    if (ei && (view === "today" ? (ei.kind === "trial" || ei.level) : (ei.level === "urgent" || ei.level === "last"))) h += bannerEnd(ei);
    if (view === "today") h += extraBanners();
    if (state.demo) h += '<div class="demo"><span>Ce sont des exemples pour essayer.</span><button data-act="clear">Effacer les exemples</button></div>';
    h += view === "today" ? today() : view === "clients" ? clients() : stockView();
    document.getElementById("app").innerHTML = h;
    updateDot();
  }
  function bannerEnd(ei) {
    var t = '<span data-cdtext>' + remainText(ei.ms) + "</span>";
    var txt = ei.kind === "trial"
      ? (ei.level === "last" ? "Dernier jour d'essai gratuit ! Il reste " + t + ". Voir l'abonnement" : "Essai gratuit : il reste " + t + ". Voir l'abonnement")
      : (ei.level === "last" ? "Dernier jour ! Ton abonnement se termine dans " + t + ". Renouveler" : "Ton abonnement se termine dans " + t + ". Renouveler");
    return '<button class="trialbar ' + ei.level + '" data-act="sub">' + txt + "</button>";
  }

  function today() {
    var tx = state.tx.filter(function (t) { return sameDay(t.at); });
    var ventes = tx.filter(function (t) { return t.type === "sale"; }).reduce(function (s, t) { return s + t.total; }, 0);
    var encaisse = tx.reduce(function (s, t) { return s + t.paid; }, 0);
    var dettes = totalDebt();
    var h = isBiz() ? bizCard() : "";
    h += '<div class="hero"><span class="lbl">Ventes du jour</span><span class="big num">' + fmt(ventes).replace(" FCFA", "") + ' <small>FCFA</small></span></div>';
    h += '<div class="pair"><div class="stat"><div class="lbl">Encaissé</div><div class="val num">' + fmt(encaisse) + '</div></div>' +
      '<div class="stat debt"><div class="lbl">On me doit</div><div class="val num">' + fmt(dettes) + '</div></div></div>';
    h += '<div class="actions"><button class="btn alt" data-act="report" data-r="today">Voir mon bilan</button><button class="btn alt" data-act="archives">Archives par jour</button></div>';

    var debtors = state.clients.map(function (c) { return { c: c, d: debtOf(c.id), l: dueDays(c) }; })
      .filter(function (x) { return x.d > 0; }).sort(function (a, b) {
        var al = a.l !== null && a.l <= 0, bl = b.l !== null && b.l <= 0;
        if (al !== bl) return al ? -1 : 1;
        if (al && bl && a.l !== b.l) return a.l - b.l;
        return b.d - a.d;
      }).slice(0, 5);
    var late = lateCount();
    h += '<section class="block"><h2>Qui me doit</h2>' + (late ? '<div class="rest">' + late + " client" + (late > 1 ? "s" : "") + " à relancer aujourd'hui</div>" : "") + '<div class="list">';
    if (!debtors.length) h += '<div class="empty">Personne ne te doit rien. Les dettes apparaîtront ici quand tu vendras à crédit.</div>';
    debtors.forEach(function (x) {
      var wa = waLink(x.c, x.d);
      h += '<div class="row"><button class="linklike" data-act="client" data-id="' + x.c.id + '"><span class="name">' + esc(x.c.name) + '</span><span class="sub neg num">doit ' + fmt(x.d) + dueLabel(x.c) + "</span></button>" +
        (wa ? '<a class="btn wa small" href="' + wa + '" target="_blank" rel="noopener">Relancer</a>'
            : '<button class="btn alt small" data-act="client" data-id="' + x.c.id + '">Ajouter le n°</button>') + "</div>";
    });
    h += "</div>" + (debtors.length ? '<div class="hint">« Relancer » ouvre WhatsApp avec le message déjà écrit. Il reste à appuyer sur Envoyer.</div>' : "") + "</section>";
    var low = lowStock();
    if (low.length) {
      h += '<section class="block"><h2>Stock bas</h2><div class="list">';
      low.forEach(function (p) { h += '<button class="row" data-act="product" data-id="' + p.id + '"><div class="main"><div class="name">' + esc(p.name) + '</div></div><span class="pill low num">reste ' + stockOf(p.id) + " " + esc(p.unit) + "</span></button>"; });
      h += "</div></section>";
    }

    h += '<section class="block"><h2>Opérations du jour</h2><div class="list">';
    if (!tx.length) h += '<div class="empty">Aucune vente aujourd\'hui. Touche « + Vente » pour commencer.</div>';
    tx.slice().reverse().forEach(function (t) { h += txRow(t); });
    h += "</div></section>";
    h += contactBlock();
    return h;
  }

  function undoBtn(kind, id) { return '<button class="undo" data-act="askdel" data-kind="' + kind + '" data-id="' + id + '">Annuler cette opération</button>'; }
  function txRow(t) {
    var c = t.clientId ? client(t.clientId) : null;
    var who = c ? c.name : "Client de passage";
    var pr = t.productId ? product(t.productId) : null;
    var sub = (t.type === "sale" ? "Vente" : "Paiement reçu") + " · " + t.mode + (pr ? " · " + t.pqty + " " + pr.unit + " " + pr.name : "") + (t.note ? " · " + t.note : "");
    var right = t.type === "sale"
      ? '<span class="amt num">' + fmt(t.total) + "</span>"
      : '<span class="amt num pos">+ ' + fmt(t.paid) + "</span>";
    var rest = t.type === "sale" && t.total - t.paid > 0 ? '<div class="sub neg num">Reste ' + fmt(t.total - t.paid) + "</div>" : "";
    if (t.chg > 0) rest += '<div class="sub num">Monnaie restante ' + fmt(t.chg) + "</div>";
    return '<div class="row"><div class="main"><div class="name">' + esc(who) + '</div><div class="sub">' + esc(sub) + "</div>" + rest + txActs(t) + "</div>" + right + "</div>";
  }

  function clients() {
    var q = query.trim().toLowerCase();
    var list = state.clients.filter(function (c) { return !q || c.name.toLowerCase().indexOf(q) > -1; })
      .sort(function (a, b) { return debtOf(b.id) - debtOf(a.id); });
    var h = '<input class="search" id="q" type="search" placeholder="Chercher un client" value="' + esc(query) + '" aria-label="Chercher un client">';
    h += '<div class="actions"><button class="btn alt" data-act="newclient">+ Nouveau client</button><button class="btn alt" data-act="settings">Mon message de rappel</button></div>';
    h += '<div class="list">';
    if (!list.length) h += '<div class="empty">' + (state.clients.length ? "Aucun client ne correspond." : "Aucun client pour l'instant. Ajoute le premier avec « + Nouveau client ».") + "</div>";
    list.forEach(function (c) {
      var d = debtOf(c.id);
      h += '<button class="row" data-act="client" data-id="' + c.id + '"><div class="main"><div class="name">' + esc(c.name) + '</div><div class="sub">' + esc(c.phone || "Sans numéro") + (c.chg > 0 ? " · monnaie à lui rendre " + fmt(c.chg) : "") + "</div></div>" +
        (d > 0 ? '<span class="pill debt num">' + fmt(d) + "</span>" : '<span class="pill ok">À jour</span>') + "</button>";
    });
    return h + "</div>";
  }

  /* ---------- Fenêtres (sheets) ---------- */
  function openSheet(title, body) {
    document.getElementById("overlay").innerHTML =
      '<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="head"><h2>' + esc(title) + '</h2><button class="x" data-act="close" aria-label="Fermer">✕</button></div>' + body + "</div></div>";
    var first = document.querySelector("#overlay input:not([type=radio]), #overlay select");
    if (first) first.focus();
  }
  function closeSheet() { document.getElementById("overlay").innerHTML = ""; }

  function modeField(name) {
    return '<div class="field"><label>Mode de paiement</label><div class="seg">' + MODES.map(function (m, i) {
      return '<input type="radio" name="' + name + '" id="' + name + i + '" value="' + m + '"' + (i === 0 ? " checked" : "") + '><label for="' + name + i + '">' + m + "</label>";
    }).join("") + "</div></div>";
  }
  function checkedMode(name) { var r = document.querySelector('input[name="' + name + '"]:checked'); return r ? r.value : MODES[0]; }

  function saleSheet(preId) {
    var opts = '<option value="">Client de passage</option>' + state.clients.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === preId ? " selected" : "") + ">" + esc(c.name) + "</option>";
    }).join("") + '<option value="__new">+ Nouveau client</option>';
    openSheet("Nouvelle vente", voiceBox() +
      '<div class="field"><label for="s-total">Montant de la vente (FCFA)</label><input class="bigin num" id="s-total" inputmode="numeric" placeholder="0" autocomplete="off"></div>' +
      '<div class="field"><label for="s-client">Client</label><select id="s-client">' + opts + "</select></div>" +
      '<div id="s-new" hidden><div class="field"><label for="s-newname">Nom du nouveau client</label><input id="s-newname" autocomplete="off"></div>' +
      '<div class="field"><label for="s-newphone">Téléphone (pour les rappels WhatsApp)</label><input id="s-newphone" inputmode="tel" autocomplete="off"></div></div>' +
      '<div class="field"><label for="s-paid">Montant payé maintenant (FCFA)</label><input class="num" id="s-paid" inputmode="numeric" placeholder="Laisser vide si tout est payé" autocomplete="off">' +
      '<div class="quick"><button class="btn alt small" data-act="allpaid" type="button">Tout payé</button><button class="btn alt small" data-act="credit" type="button">Tout à crédit</button></div></div>' +
      '<div id="s-rest" class="rest zero">Reste à payer : 0 FCFA</div>' +
      '<div class="field"><label for="s-chg">Monnaie restante à rendre au client (FCFA)</label><input class="num" id="s-chg" inputmode="numeric" placeholder="0" autocomplete="off"><div class="hint">Le client a donné plus et tu n\'as pas pu rendre la monnaie ? Écris-la ici : elle est notée au nom du client. Sinon laisse 0.</div></div>' +
      '<div id="s-due" hidden><div class="field"><label for="s-duedate">Il doit payer avant le (facultatif)</label><input type="date" id="s-duedate">' +
      '<div class="quick"><button class="btn alt small" data-act="duein" data-d="3" type="button">3 jours</button><button class="btn alt small" data-act="duein" data-d="7" type="button">7 jours</button><button class="btn alt small" data-act="duein" data-d="15" type="button">15 jours</button><button class="btn alt small" data-act="duein" data-d="30" type="button">30 jours</button></div>' +
      '<div class="hint">Le jour venu, il apparaît dans « Qui me doit » avec un rappel.</div></div></div>' +
      modeField("s-mode") +
      (state.products.length ? '<div class="field"><label for="s-prod">Produit vendu (met le stock à jour)</label><select id="s-prod"><option value="">Aucun, ne pas toucher au stock</option>' +
        state.products.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name) + " (" + stockOf(p.id) + " " + esc(p.unit) + ")</option>"; }).join("") + "</select></div>" +
        '<div id="s-pq" hidden><div class="field"><label for="s-pqty">Quantité vendue</label><input class="num" id="s-pqty" inputmode="numeric" placeholder="0" autocomplete="off"></div></div>' : "") +
      '<div class="field"><label for="s-note">Note (facultatif)</label><input id="s-note" placeholder="Ex : riz 25 kg" autocomplete="off"></div>' +
      '<div class="err" id="s-err" role="alert"></div>' +
      '<button class="btn" data-act="savesale">Enregistrer la vente</button>');
  }
  function updateRest() {
    var t = num(document.getElementById("s-total").value), pv = document.getElementById("s-paid").value.trim();
    var p = pv === "" ? t : num(pv);
    var r = document.getElementById("s-rest"); var rest = Math.max(0, t - p);
    r.textContent = "Reste à payer : " + fmt(rest); r.className = "rest" + (rest === 0 ? " zero" : "");
    var dw = document.getElementById("s-due"); if (dw) dw.hidden = rest === 0;
  }
  function saveSale() {
    var total = num(document.getElementById("s-total").value);
    var paidRaw = document.getElementById("s-paid").value.trim();
    var paid = paidRaw === "" ? total : num(paidRaw);
    var cid = document.getElementById("s-client").value;
    var err = document.getElementById("s-err");
    if (total <= 0) { err.textContent = "Entre le montant de la vente."; return; }
    if (paid > total) { err.textContent = "Le montant payé ne peut pas dépasser la vente."; return; }
    var ps = document.getElementById("s-prod"), pid = ps ? ps.value : "", pq = pid ? num(document.getElementById("s-pqty").value) : 0;
    if (pid) {
      if (pq <= 0) { err.textContent = "Entre la quantité vendue."; return; }
      if (pq > stockOf(pid)) { err.textContent = "Stock insuffisant : il reste " + stockOf(pid) + " " + product(pid).unit + "."; return; }
    }
    var chg = num(document.getElementById("s-chg").value);
    if (paid < total && !cid) { err.textContent = "Choisis un client pour noter la dette."; return; }
    if (chg > 0 && !cid) { err.textContent = "Choisis un client pour noter sa monnaie restante."; return; }
    if (cid === "__new") {
      var nm = document.getElementById("s-newname").value.trim();
      if (!nm) { err.textContent = "Écris le nom du nouveau client."; return; }
      var nc = { id: uid(), name: nm, phone: document.getElementById("s-newphone").value.trim() };
      state.clients.push(nc); cid = nc.id;
    }
    var sid = uid(), now = new Date().toISOString();
    state.tx.push({ id: sid, at: now, clientId: cid || null, type: "sale", total: total, paid: paid, mode: checkedMode("s-mode"), note: document.getElementById("s-note").value.trim(), productId: pid || null, pqty: pq, chg: chg });
    if (chg > 0 && cid) { var cc = client(cid); if (cc) cc.chg = (cc.chg || 0) + chg; }
    if (pid) state.moves.push({ id: uid(), at: now, productId: pid, type: "out", qty: pq, note: "Vente", clientId: cid || null, saleId: sid });
    if (paid < total && cid) { var dd = val("s-duedate"), dc = client(cid); if (dc && /^\d{4}-\d{2}-\d{2}$/.test(dd)) dc.due = dd; }
    save(); closeSheet(); render(); toast(chg > 0 ? "Vente et monnaie restante enregistrées" : paid < total ? "Vente et dette enregistrées" : "Vente enregistrée");
  }

  function clientSheet(id) {
    var c = client(id); if (!c) return;
    var d = debtOf(id);
    var hist = state.tx.filter(function (t) { return t.clientId === id; }).slice().reverse();
    var wa = d > 0 ? waLink(c, d) : "";
    var h = '<div class="pair"><div class="stat ' + (d > 0 ? "debt" : "") + '"><div class="lbl">Solde dû</div><div class="val num">' + fmt(Math.max(0, d)) + '</div></div>' +
      '<div class="stat"><div class="lbl">Téléphone</div><div class="val" style="font-size:1.05rem">' + esc(c.phone || "—") + "</div></div></div>";
    if (c.chg > 0) h += '<div class="rest" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>Monnaie à lui rendre : <b class="num">' + fmt(c.chg) + '</b></span><button class="btn small" data-act="chgsheet" data-id="' + id + '">Rendre la monnaie</button></div>';
    h += '<div class="actions">';
    if (d > 0) h += '<button class="btn" data-act="paysheet" data-id="' + id + '">Encaisser un paiement</button>';
    h += '<button class="btn alt" data-act="saleclient" data-id="' + id + '">Nouvelle vente</button>';
    if (wa) h += '<a class="btn wa" href="' + wa + '" target="_blank" rel="noopener">Relancer sur WhatsApp</a>';
    else if (d > 0) h += '<div class="empty" style="flex-basis:100%;padding:0">Ajoute un numéro pour envoyer un rappel WhatsApp.</div>';
    h += "</div>";
    h += '<div class="field"><label for="c-phone">Modifier le téléphone</label><div class="actions"><input id="c-phone" inputmode="tel" value="' + esc(c.phone) + '" style="padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"><button class="btn alt small" data-act="savephone" data-id="' + id + '" style="flex:0 0 auto">Enregistrer</button></div></div>';
    if (d > 0) h += '<div class="field"><label for="c-due">Il doit payer avant le</label><div class="actions"><input type="date" id="c-due" value="' + esc(c.due || "") + '" style="padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)"><button class="btn alt small" data-act="savedue" data-id="' + id + '" style="flex:0 0 auto">Enregistrer</button></div>' + (dueLabel(c) ? '<div class="hint neg">' + esc(dueLabel(c).replace(/^ · /, "")) + "</div>" : "") + "</div>";
    h += '<h3 style="font-size:1rem">Historique</h3><div class="list">';
    if (!hist.length) h += '<div class="empty">Pas encore d\'opération.</div>';
    hist.forEach(function (t) { h += '<div class="row"><div class="main"><div class="name">' + (t.type === "sale" ? "Vente " + fmt(t.total) : "Paiement reçu") + '</div><div class="sub">' + dShort(t.at) + " · " + t.mode + (t.note ? " · " + esc(t.note) : "") + "</div>" + txActs(t) + "</div>" +
      (t.type === "sale" ? (t.total - t.paid > 0 ? '<span class="amt num neg">Reste ' + fmt(t.total - t.paid) + "</span>" : '<span class="pill ok">Payé</span>') : '<span class="amt num pos">+ ' + fmt(t.paid) + "</span>") + "</div>"; });
    h += "</div>";
    openSheet(c.name, h);
  }

  function chgSheet(id) {
    var c = client(id); if (!c || !(c.chg > 0)) return;
    openSheet("Rendre la monnaie",
      '<div class="rest">Monnaie à rendre à ' + esc(c.name.split(" ")[0]) + " : " + fmt(c.chg) + "</div>" +
      '<div class="field"><label for="g-amt">Montant rendu maintenant (FCFA)</label><input class="bigin num" id="g-amt" inputmode="numeric" value="' + c.chg + '" autocomplete="off"></div>' +
      '<div class="err" id="g-err" role="alert"></div><button class="btn" data-act="savechg" data-id="' + id + '">Monnaie rendue</button>');
  }
  function saveChg(id) {
    var c = client(id), a = num(document.getElementById("g-amt").value), err = document.getElementById("g-err"); if (!c) return;
    if (a <= 0) { err.textContent = "Entre le montant rendu."; return; }
    if (a > (c.chg || 0)) { err.textContent = "Ce montant dépasse la monnaie restante (" + fmt(c.chg) + ")."; return; }
    c.chg = (c.chg || 0) - a; save(); render(); clientSheet(id); toast("Monnaie rendue");
  }
  function totalChg() { return state.clients.reduce(function (s, c) { return s + (c.chg || 0); }, 0); }
  function paySheet(id) {
    var c = client(id), d = debtOf(id);
    openSheet("Paiement de " + c.name.split(" ")[0],
      '<div class="rest">Solde dû : ' + fmt(d) + "</div>" +
      '<div class="field"><label for="p-amt">Montant reçu (FCFA)</label><input class="bigin num" id="p-amt" inputmode="numeric" value="' + d + '" autocomplete="off"></div>' +
      modeField("p-mode") + '<div class="err" id="p-err" role="alert"></div>' +
      '<button class="btn" data-act="savepay" data-id="' + id + '">Enregistrer le paiement</button>');
  }
  function savePay(id) {
    var a = num(document.getElementById("p-amt").value), d = debtOf(id), err = document.getElementById("p-err");
    if (a <= 0) { err.textContent = "Entre le montant reçu."; return; }
    if (a > d) { err.textContent = "Ce montant dépasse la dette de " + fmt(d) + "."; return; }
    state.tx.push({ id: uid(), at: new Date().toISOString(), clientId: id, type: "payment", total: 0, paid: a, mode: checkedMode("p-mode"), note: "Remboursement" });
    if (debtOf(id) <= 0) { var c0 = client(id); if (c0) c0.due = ""; }
    save(); closeSheet(); render(); toast("Paiement enregistré");
  }

  function newClientSheet() {
    openSheet("Nouveau client",
      '<div class="field"><label for="n-name">Nom</label><input id="n-name" autocomplete="off"></div>' +
      '<div class="field"><label for="n-phone">Téléphone (pour les rappels WhatsApp)</label><input id="n-phone" inputmode="tel" autocomplete="off"></div>' +
      '<div class="err" id="n-err" role="alert"></div><button class="btn" data-act="saveclient">Ajouter le client</button>');
  }

  /* ---------- Page Stock ---------- */
  function sumQty(a) { return a.reduce(function (s, m) { return s + m.qty; }, 0); }
  function moveRow(m, withDate) {
    var p = product(m.productId); if (!p) return "";
    var c = m.clientId ? client(m.clientId) : null;
    var sub = (m.type === "in" ? "Entrée" : "Sortie") + " · " + (withDate ? (sameDay(m.at) ? "aujourd'hui" : dShort(m.at)) : "") + (c ? " · " + esc(c.name) : "") + (m.note ? " · " + esc(m.note) : "");
    return '<div class="row"><div class="main"><div class="name">' + esc(p.name) + '</div><div class="sub">' + sub.replace("·  ·", "·") + '</div>' + undoBtn("move", m.id) + '</div><span class="qty num ' + (m.type === "in" ? "pos" : "neg") + '">' + (m.type === "in" ? "+ " : "− ") + m.qty + " " + esc(p.unit) + "</span></div>";
  }
  function stockView() {
    var mv = state.moves.filter(function (m) { return sameDay(m.at); });
    var ins = mv.filter(function (m) { return m.type === "in"; }), outs = mv.filter(function (m) { return m.type === "out"; });
    var h = '<div class="pair"><div class="stat"><div class="lbl">Marchandises reçues</div><div class="val num">' + sumQty(ins) + '</div><div class="sub">aujourd\'hui · ' + ins.length + " réception" + (ins.length > 1 ? "s" : "") + '</div></div>' +
      '<div class="stat"><div class="lbl">Livraisons et sorties</div><div class="val num">' + sumQty(outs) + '</div><div class="sub">aujourd\'hui · ' + outs.length + " sortie" + (outs.length > 1 ? "s" : "") + "</div></div></div>";
    h += '<div class="actions"><button class="btn" data-act="movein">+ Entrée</button><button class="btn alt" data-act="moveout">+ Sortie / livraison</button><button class="btn alt" data-act="newproduct">+ Nouveau produit</button></div>';
    h += '<section class="block"><h2>Mon stock</h2><div class="list">';
    if (!state.products.length) h += '<div class="empty">Aucun produit. Ajoute le premier avec « + Nouveau produit », avec sa quantité de départ.</div>';
    state.products.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "fr"); }).forEach(function (p) {
      var q = stockOf(p.id), low = p.min > 0 && q <= p.min;
      h += '<button class="row" data-act="product" data-id="' + p.id + '"><div class="main"><div class="name">' + esc(p.name) + '</div>' + (p.min > 0 ? '<div class="sub">Alerte à ' + p.min + " " + esc(p.unit) + "</div>" : "") + "</div>" +
        (low ? '<span class="pill low">Stock bas</span>' : "") + '<span class="qty num">' + q + " " + esc(p.unit) + "</span></button>";
    });
    h += "</div></section>";
    h += '<section class="block"><h2>Derniers mouvements</h2><div class="list">';
    var last = state.moves.slice().sort(function (a, b) { return new Date(b.at) - new Date(a.at); }).slice(0, 25);
    if (!last.length) h += '<div class="empty">Chaque entrée et chaque sortie notée apparaîtra ici, avec sa date.</div>';
    last.forEach(function (m) { h += moveRow(m, true); });
    return h + "</div></section>";
  }

  function moveSheet(type, preId) {
    var isIn = type === "in";
    var opts = '<option value="">Choisir un produit</option>' + state.products.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === preId ? " selected" : "") + ">" + esc(p.name) + " (" + stockOf(p.id) + " " + esc(p.unit) + ")</option>";
    }).join("") + (isIn ? '<option value="__new">+ Nouveau produit</option>' : "");
    var copts = '<option value="">Aucun client précis</option>' + state.clients.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + "</option>"; }).join("");
    openSheet(isIn ? "Entrée de marchandise" : "Sortie / livraison",
      '<div class="field"><label for="m-prod">Produit</label><select id="m-prod">' + opts + "</select></div>" +
      '<div id="m-new" hidden><div class="field"><label for="m-newname">Nom du produit</label><input id="m-newname" placeholder="Ex : Riz 25 kg" autocomplete="off"></div>' +
      '<div class="field"><label for="m-newunit">Unité</label><input id="m-newunit" placeholder="sacs, cartons, kg, bidons…" autocomplete="off"></div></div>' +
      '<div class="field"><label for="m-qty">Quantité ' + (isIn ? "reçue" : "sortie") + '</label><input class="bigin num" id="m-qty" inputmode="numeric" placeholder="0" autocomplete="off"></div>' +
      '<div class="field"><label for="m-date">Date</label><input type="date" id="m-date" value="' + todayStr() + '"></div>' +
      (isIn ? "" : '<div class="field"><label for="m-client">Livré à</label><select id="m-client">' + copts + "</select></div>") +
      '<div class="field"><label for="m-note">Note (facultatif)</label><input id="m-note" placeholder="' + (isIn ? "Ex : fournisseur, numéro de bon" : "Ex : livraison, casse, usage perso") + '" autocomplete="off"></div>' +
      '<div class="err" id="m-err" role="alert"></div><button class="btn" data-act="savemove" data-type="' + type + '">Enregistrer</button>');
  }
  function saveMove(type) {
    var err = document.getElementById("m-err"), pid = document.getElementById("m-prod").value, qty = num(document.getElementById("m-qty").value);
    if (!pid) { err.textContent = "Choisis un produit."; return; }
    if (pid === "__new") {
      var nm = document.getElementById("m-newname").value.trim();
      if (!nm) { err.textContent = "Écris le nom du nouveau produit."; return; }
      if (qty <= 0) { err.textContent = "Entre la quantité."; return; }
      var np = { id: uid(), name: nm, unit: document.getElementById("m-newunit").value.trim() || "unités", min: 0 };
      state.products.push(np); pid = np.id;
    }
    if (qty <= 0) { err.textContent = "Entre la quantité."; return; }
    if (type === "out" && qty > stockOf(pid)) { err.textContent = "Stock insuffisant : il reste " + stockOf(pid) + " " + product(pid).unit + "."; return; }
    var cl = document.getElementById("m-client");
    state.moves.push({ id: uid(), at: dateFromInput(document.getElementById("m-date").value), productId: pid, type: type, qty: qty, note: document.getElementById("m-note").value.trim(), clientId: cl && cl.value ? cl.value : null });
    save(); closeSheet(); render(); toast(type === "in" ? "Entrée enregistrée" : "Sortie enregistrée");
  }

  function newProductSheet() {
    openSheet("Nouveau produit",
      '<div class="field"><label for="n-pname">Nom du produit</label><input id="n-pname" placeholder="Ex : Huile 5 L" autocomplete="off"></div>' +
      '<div class="field"><label for="n-punit">Unité</label><input id="n-punit" placeholder="sacs, cartons, kg, bidons…" autocomplete="off"></div>' +
      '<div class="field"><label for="n-pqty">Quantité en stock aujourd\'hui</label><input class="num" id="n-pqty" inputmode="numeric" placeholder="0" autocomplete="off"></div>' +
      '<div class="field"><label for="n-pmin">Prévenir quand il en reste moins de (facultatif)</label><input class="num" id="n-pmin" inputmode="numeric" placeholder="Ex : 5" autocomplete="off"></div>' +
      '<div class="err" id="n-perr" role="alert"></div><button class="btn" data-act="saveproduct">Ajouter le produit</button>');
  }
  function saveProduct() {
    var nm = document.getElementById("n-pname").value.trim();
    if (!nm) { document.getElementById("n-perr").textContent = "Écris le nom du produit."; return; }
    var p = { id: uid(), name: nm, unit: document.getElementById("n-punit").value.trim() || "unités", min: num(document.getElementById("n-pmin").value) };
    state.products.push(p);
    var q = num(document.getElementById("n-pqty").value);
    if (q > 0) state.moves.push({ id: uid(), at: new Date().toISOString(), productId: p.id, type: "in", qty: q, note: "Stock de départ" });
