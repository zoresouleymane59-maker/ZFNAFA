      ["Vendre et baisser le stock en même temps", '<p>Dans <b>+ Vente</b>, choisis le <b>Produit vendu</b> et la quantité. Le stock baisse tout seul, sans rien noter deux fois.</p>'],
      ["Mon profil et mon identifiant", '<p>Ouvre le menu <b>⋮</b> en haut à droite, puis touche ton nom ou <b>Mon profil</b>. Tu y vois tes informations, ton identifiant et l\'état de ton abonnement. Touche <b>Modifier</b> pour corriger ton nom, ta boutique ou ton numéro.</p>'],
      ["Abonnement", '<ol><li>Tu as 7 jours d\'essai gratuit.</li><li>Ensuite, l\'abonnement coûte 3 000 FCFA par mois.</li><li>Ouvre le menu <b>⋮</b> en haut à droite, puis touche <b>Abonnement</b>.</li><li>Envoie le montant par Orange Money ou Wave au numéro affiché.</li><li>Écris ton numéro de paiement, puis touche <b>J\'ai payé</b>. Ton identifiant est envoyé avec le message sur WhatsApp.</li><li>Nous vérifions ton paiement et tu reçois ton code.</li><li>Colle le code dans <b>J\'ai reçu mon code</b> et touche <b>Activer</b>.</li></ol><p>Si ton essai se termine, tes données restent en sécurité. Tu peux les sauvegarder avant de t\'abonner.</p>'],
      ["Messages et fin d'abonnement", '<p>Quand tu as un nouveau message, un <b>point rouge</b> apparaît sur le menu ⋮. Touche <b>Messages</b> pour le lire.</p><p>Quand ton abonnement ou ton essai va se terminer, l\'application te prévient sur l\'accueil, dans une fenêtre et dans les messages. Dans <b>Abonnement</b>, un chronomètre montre le temps qui reste, jusqu\'aux secondes.</p>'],
      ["Dicter une vente avec la voix", '<ol><li>Touche <b>+ Vente</b>, puis <b>Dicter la vente</b>.</li><li>Parle : « 5000 francs à Awa, payé 2000 » ou « 10 000 à crédit pour Boukary ».</li><li>Le formulaire se remplit. Vérifie, puis touche <b>Enregistrer la vente</b>.</li></ol><p>Il faut internet, le navigateur Chrome et l\'accès au micro. Dis « à crédit » pour une dette, « Orange Money » ou « Moov Money » pour le mode de paiement.</p>'],
      ["Date de paiement et relances", '<p>Quand une vente est à crédit, choisis « Il doit payer avant le » (3, 7, 15 ou 30 jours). Le jour venu, le client monte en haut de <b>Qui me doit</b> avec la mention « en retard de … jours », et tu le relances en un geste. Tu peux aussi changer la date dans la fiche du client.</p>'],
      ["Bilan et chiffres", '<p>Touche <b>Voir mon bilan</b> sur l\'accueil, ou ouvre le menu <b>⋮</b> puis <b>Bilan et chiffres</b>. Tu vois les ventes, ce qui est encaissé, le crédit accordé, les plus grosses dettes et les produits les plus vendus, pour aujourd\'hui, 7 jours ou 30 jours. Touche <b>Envoyer sur WhatsApp</b> pour partager le bilan.</p>'],
      ["Envoyer un reçu au client", '<p>Sous chaque vente ou paiement, touche <b>Envoyer le reçu</b>. WhatsApp s\'ouvre avec le reçu déjà écrit (montant, payé, reste à payer).</p>'],
      ["Code secret", '<p>Ouvre le menu <b>⋮</b>, touche <b>Code secret</b> et choisis 4 chiffres. Le code est demandé à l\'ouverture et quand tu reviens après une minute. Si tu l\'oublies, touche « J\'ai oublié mon code » et écris le numéro WhatsApp de ton compte. Tes données ne sont pas effacées.</p>'],
      ["Installer l\'application et travailler sans internet", '<p>Dans le menu <b>⋮</b>, touche <b>Installer l\'application</b> (ou dans le menu de Chrome, « Installer l\'application »). ZFNAFA s\'ouvre alors comme une vraie application, avec son icône, et marche même sans internet. Les ventes sont gardées dans ton téléphone.</p>'],
      ["Fichiers et Excel", '<p>Dans <b>Sauvegarde et fichiers</b>, tu peux télécharger ta sauvegarde en fichier, la liste de tes opérations et la liste de tes dettes. Les fichiers Excel s\'ouvrent avec Excel ou Google Sheets. Toutes les semaines, l\'application te rappelle de faire une sauvegarde.</p>'],
      ["Mon entreprise (restaurant, garage, quincaillerie…)", '<p>Si tu as choisi une activité d\'<b>Entreprise</b> à l\'inscription, une carte <b>Mon entreprise</b> apparaît en haut de l\'accueil. Chaque partie a son coin :</p><ul><li><b>Commandes / Travaux / Rendez-vous</b> : note chaque client, fais-le avancer d\'une étape, puis touche <b>Encaisser</b>. La vente et la dette sont notées toutes seules.</li><li><b>Dépenses</b> : loyer, achats, électricité…</li><li><b>Équipe et salaires</b> : touche <b>Payer</b>, le salaire va dans les dépenses.</li><li><b>Bénéfice</b> = ce que tu as encaissé − tes dépenses, pour aujourd\'hui ou pour le mois.</li></ul><p>Tu peux changer ton activité dans <b>Mon profil → Modifier</b>.</p>'],
      ["Connecteur : importer ma boutique en ligne", '<ol><li>Dans ta boutique en ligne (Shopify, WooCommerce, Jumia…), exporte tes commandes en fichier <b>CSV</b>.</li><li>Ouvre le menu <b>⋮</b>, touche <b>Connecteur</b>, puis choisis le fichier.</li><li>Vérifie le résumé : ventes, crédits, commandes annulées ou remboursées. Touche <b>Importer</b>.</li></ol><p>Les ventes importées apparaissent dans ton bilan et tes archives par jour. Une commande déjà importée n\'est jamais comptée deux fois. La connexion automatique avec identifiant et mot de passe n\'existe pas encore : elle demande un serveur sécurisé.</p>'],
      ["Archives par jour", '<p>Chaque journée est enregistrée toute seule, avec sa date : les ventes du 1er, du 2 et du 3 ne se mélangent jamais. Touche <b>Archives par jour</b> sur l\'accueil (ou dans le menu <b>⋮</b>), puis une journée pour voir ses ventes, ses dettes créées, les paiements reçus, les dettes en fin de journée et le stock.</p><p>Touche <b>Télécharger le fichier du jour</b> pour garder un fichier Excel de cette journée dans ton téléphone. Chaque matin, l\'application te propose de télécharger le fichier de la veille. Elle garde aussi une copie automatique par jour (7 derniers jours) dans <b>Sauvegarde et fichiers</b>.</p>'],
      ["Corriger une erreur", '<p>Sous chaque opération, touche <b>Annuler cette opération</b>, puis confirme. La dette et le stock reviennent comme avant.</p>'],
      ["Sauvegarder mes données", '<ol><li>Ouvre le menu <b>⋮</b> en haut à droite, puis touche <b>Sauvegarde de mes données</b>.</li><li>Touche <b>Copier la sauvegarde</b>.</li><li>Colle-la dans une note ou envoie-la à toi-même sur WhatsApp.</li></ol><p>Tes données sont gardées dans ce téléphone. Fais une sauvegarde de temps en temps, surtout si tu changes de téléphone. Pour tout remettre, colle la sauvegarde dans « Restaurer une sauvegarde ».</p>']
    ];
    openSheet("Guide d'utilisation",
      items.map(function (it, i) { return '<details class="gd"' + (i === 0 ? " open" : "") + "><summary>" + it[0] + '</summary><div class="body">' + it[1] + "</div></details>"; }).join("") + contactBlock());
  }

  /* ---------- Annuler une opération ---------- */
  function askDel(kind, id) {
    var msg;
    if (kind === "expense" || kind === "staff" || kind === "order") {
      msg = kind === "expense" ? "Cette dépense sera supprimée." : kind === "staff" ? "Cette personne sera retirée de ton équipe (ses dépenses déjà notées restent)." : "Cela sera supprimé de ta liste (aucune vente n'est retirée).";
    } else if (kind === "tx") {
      var t = state.tx.filter(function (x) { return x.id === id; })[0]; if (!t) return;
      msg = t.type === "sale" ? "Cette vente de " + fmt(t.total) + " sera retirée, avec sa dette" + (t.productId ? " et la sortie de stock liée" : "") + "." : "Ce paiement de " + fmt(t.paid) + " sera retiré. La dette du client augmentera.";
    } else {
      var m = state.moves.filter(function (x) { return x.id === id; })[0]; if (!m) return;
      if (m.saleId) { toast("Cette sortie vient d'une vente. Annule la vente pour la retirer."); return; }
      var p = product(m.productId);
      if (m.type === "in" && p && stockOf(p.id) - m.qty < 0) { toast("Impossible : une partie de cette entrée est déjà sortie."); return; }
      msg = "Ce mouvement de " + m.qty + " " + (p ? p.unit : "") + " sera retiré du stock.";
    }
    openSheet("Annuler cette opération ?",
      '<p style="margin:0">' + esc(msg) + "</p>" +
      '<div class="actions"><button class="btn" data-act="dodel" data-kind="' + kind + '" data-id="' + id + '">Oui, annuler</button><button class="btn alt" data-act="close">Non, garder</button></div>');
  }
  function doDel(kind, id) {
    if (kind === "expense") { B().expenses = B().expenses.filter(function (x) { return x.id !== id; }); save(); expensesSheet(); render(); toast("Supprimé"); return; }
    if (kind === "staff") { B().staff = B().staff.filter(function (x) { return x.id !== id; }); save(); staffSheet(); toast("Retiré"); return; }
    if (kind === "order") { B().orders = B().orders.filter(function (x) { return x.id !== id; }); save(); ordersSheet(); render(); toast("Supprimé"); return; }
    if (kind === "tx") {
      var dt = state.tx.filter(function (x) { return x.id === id; })[0];
      if (dt && dt.chg > 0 && dt.clientId) { var dc2 = client(dt.clientId); if (dc2) dc2.chg = Math.max(0, (dc2.chg || 0) - dt.chg); }
      state.tx = state.tx.filter(function (x) { return x.id !== id; });
      state.moves = state.moves.filter(function (m) { return m.saleId !== id; });
    } else state.moves = state.moves.filter(function (x) { return x.id !== id; });
    save(); closeSheet(); render(); toast("Opération annulée");
  }

  /* ---------- Sauvegarde ---------- */
  function backupSheet() {
    openSheet("Sauvegarde",
      '<p class="hint" style="margin:0">Tes données sont gardées dans ce téléphone. Copie la sauvegarde et colle-la dans une note ou un message à toi-même. Elle te permet de tout retrouver sur un autre téléphone.</p>' +
      '<div class="field"><label for="bk-out">Ma sauvegarde</label><textarea id="bk-out" readonly>' + esc(JSON.stringify(state)) + "</textarea></div>" +
      '<button class="btn" data-act="copybackup">Copier la sauvegarde</button>' +
      '<div class="field"><label>Fichiers à télécharger</label><div class="actions"><button class="btn alt small" data-act="dlbackup">Sauvegarde (fichier)</button><button class="btn alt small" data-act="dlops">Opérations (Excel)</button><button class="btn alt small" data-act="dldebts">Dettes (Excel)</button></div></div>' + snapList() +
      '<div class="field"><label for="bk-in">Restaurer une sauvegarde</label><textarea id="bk-in" placeholder="Colle ici la sauvegarde copiée"></textarea><input type="file" id="bk-file" accept=".json,application/json,text/plain"><div class="hint">Ou choisis le fichier de sauvegarde téléchargé avant.</div></div>' +
      '<div class="err" id="bk-err" role="alert"></div>' +
      '<button class="btn alt" data-act="restorebackup">Remplacer mes données par cette sauvegarde</button>');
  }

  /* ---------- Actions ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
    if (act === "close") { if (e.target === el || el.classList.contains("x")) closeSheet(); return; }
    if (el.closest(".menu")) closeSheet();
    if (act === "tab") { view = el.getAttribute("data-tab"); render(); window.scrollTo(0, 0); }
    else if (act === "menu") menuSheet()
    else if (act === "messages") messagesSheet()
    else if (act === "connector") connectorSheet()
    else if (act === "cnimport") cnImport()
    else if (act === "theme") themeSheet()
    else if (act === "settheme") setTheme(el.getAttribute("data-t"))
    else if (act === "lang") langSheet()
    else if (act === "setlang") setLang(el.getAttribute("data-l"))
    else if (act === "biz") bizSheet()
    else if (act === "bizp") { bizP = el.getAttribute("data-p"); bizSheet(); }
    else if (act === "stocktab") { closeSheet(); view = "stock"; render(); window.scrollTo(0, 0); }
    else if (act === "expenses") expensesSheet()
    else if (act === "newexp") newExpenseSheet()
    else if (act === "saveexp") saveExpense()
    else if (act === "staff") staffSheet()
    else if (act === "newstaff") newStaffSheet()
    else if (act === "savestaff") saveStaff()
    else if (act === "paystaff") payStaff(id)
    else if (act === "orders") ordersSheet()
    else if (act === "neworder") newOrderSheet()
    else if (act === "saveorder") saveOrder()
    else if (act === "advance") advanceOrder(id)
    else if (act === "doorder") doOrder(id)
    else if (act === "archives") archivesSheet()
    else if (act === "day") daySheet(el.getAttribute("data-k"))
    else if (act === "dlday") { var kd = el.getAttribute("data-k"); if (downloadFile("ZFNAFA-journee-" + kd + ".csv", dayCsv(kd), "text/csv;charset=utf-8")) { lsSet("zfnafa.dl." + kd, "1"); render(); toast("Fichier du " + dMid(kd) + " téléchargé"); } else toast("Téléchargement impossible sur ce navigateur."); }
    else if (act === "dlall") { if (downloadFile("ZFNAFA-toutes-les-journees-" + todayStr() + ".csv", allDaysCsv(), "text/csv;charset=utf-8")) toast("Fichier téléchargé"); else toast("Téléchargement impossible sur ce navigateur."); }
    else if (act === "snaprestore") snapConfirm(el.getAttribute("data-k"))
    else if (act === "snapdo") snapRestore(el.getAttribute("data-k"))
    else if (act === "report") reportSheet(el.getAttribute("data-r") || "today")
    else if (act === "rep") reportSheet(el.getAttribute("data-r"))
    else if (act === "copyreport") copyText(lastReport, "Bilan copié")
    else if (act === "voice") startVoice()
    else if (act === "duein") { var di = document.getElementById("s-duedate"); if (di) di.value = plusDaysStr(+el.getAttribute("data-d")); }
    else if (act === "savedue") { var cc = client(id); if (cc) { var dv = val("c-due"); cc.due = /^\d{4}-\d{2}-\d{2}$/.test(dv) ? dv : ""; save(); clientSheet(id); render(); toast(cc.due ? "Date enregistrée" : "Date retirée"); } }
    else if (act === "pin") pinSheet()
    else if (act === "pinkey") pinKey(el.getAttribute("data-k"))
    else if (act === "pinset") pinSet()
    else if (act === "pinchange") pinChange()
    else if (act === "pinremove") pinRemove()
    else if (act === "pinforgot") pinForgot()
    else if (act === "pinreset") pinReset()
    else if (act === "install") doInstall()
    else if (act === "noinstall") { lsSet("zfcahier.noinstall", "1"); render(); }
    else if (act === "dlbackup") { if (downloadFile("ZFNAFA-sauvegarde-" + todayStr() + ".json", JSON.stringify(state), "application/json")) { markBackup(); toast("Fichier de sauvegarde téléchargé"); } else toast("Téléchargement impossible, utilise « Copier la sauvegarde »."); }
    else if (act === "dlops") { if (downloadFile("ZFNAFA-operations-" + todayStr() + ".csv", opsCsv(), "text/csv;charset=utf-8")) toast("Fichier téléchargé"); else toast("Téléchargement impossible sur ce navigateur."); }
    else if (act === "dldebts") { if (downloadFile("ZFNAFA-dettes-" + todayStr() + ".csv", debtsCsv(), "text/csv;charset=utf-8")) toast("Fichier téléchargé"); else toast("Téléchargement impossible sur ce navigateur."); }
    else if (act === "profile") profileSheet()
    else if (act === "editprofile") editProfileSheet()
    else if (act === "saveprofile") saveProfileEdit()
    else if (act === "guide") guideSheet()
    else if (act === "sub") subSheet()
    else if (act === "signup") signup()
    else if (act === "notified") markNotified()
    else if (act === "copytxt") {
      var tx = el.getAttribute("data-txt");
      try { navigator.clipboard.writeText(tx).then(function () { toast("Numéro copié"); }, function () { toast("Appui long sur le numéro pour le copier"); }); } catch (er) { toast("Appui long sur le numéro pour le copier"); }
    } else if (act === "copyid") {
      try { navigator.clipboard.writeText(lic.id).then(function () { toast("Identifiant copié"); }, function () { toast("Appui long sur l'identifiant pour le copier"); }); } catch (er) { toast("Appui long sur l'identifiant pour le copier"); }
    } else if (act === "activate") {
      var ae = document.getElementById("ac-err"); ae.textContent = "Vérification…";
      activate(document.getElementById("ac-code").value).then(function (r) {
        if (!r.ok) { ae.textContent = r.msg; return; }
        closeSheet(); view = "today"; render(); toast("Abonnement actif jusqu'au " + fmtDate(r.until));
      });
    }
    else if (act === "askdel") askDel(el.getAttribute("data-kind"), id)
    else if (act === "dodel") doDel(el.getAttribute("data-kind"), id)
    else if (act === "backup") backupSheet()
    else if (act === "copybackup") {
      var ta = document.getElementById("bk-out"); ta.focus(); ta.select();
      var done = function () { markBackup(); toast("Sauvegarde copiée"); };
      try { navigator.clipboard.writeText(ta.value).then(done, function () { toast("Appui long sur le texte pour le copier"); }); } catch (er) { toast("Appui long sur le texte pour le copier"); }
    } else if (act === "restorebackup") {
      var raw = document.getElementById("bk-in").value.trim(), be = document.getElementById("bk-err"), np = null;
      try { np = cleanState(JSON.parse(raw)); } catch (er) { np = null; }
      if (!np) { be.textContent = "Cette sauvegarde n'est pas valide. Copie-la de nouveau en entier."; return; }
      state = np; save(); closeSheet(); render(); toast("Données restaurées");
    }
    else if (act === "movein") moveSheet("in", id)
    else if (act === "moveout") moveSheet("out", id)
    else if (act === "savemove") saveMove(el.getAttribute("data-type"))
    else if (act === "newproduct") newProductSheet()
    else if (act === "saveproduct") saveProduct()
    else if (act === "product") productSheet(id)
    else if (act === "settings") settingsSheet()
    else if (act === "savesettings") {
      state.settings = { shop: document.getElementById("st-shop").value.trim(), template: document.getElementById("st-tpl").value.trim() };
      save(); closeSheet(); render(); toast("Message enregistré");
    } else if (act === "resettpl") { document.getElementById("st-tpl").value = DEFAULT_TPL; }
    else if (act === "start") { markIntro(); view = "today"; render(); window.scrollTo(0, 0); }
    else if (act === "intro") { view = "intro"; render(); window.scrollTo(0, 0); }
    else if (act === "sale") saleSheet();
    else if (act === "saleclient") saleSheet(id);
    else if (act === "client") clientSheet(id);
    else if (act === "paysheet") paySheet(id);
    else if (act === "chgsheet") chgSheet(id);
    else if (act === "savechg") saveChg(id);
    else if (act === "savepay") savePay(id);
    else if (act === "savesale") saveSale();
    else if (act === "newclient") newClientSheet();
    else if (act === "allpaid") { document.getElementById("s-paid").value = document.getElementById("s-total").value; updateRest(); }
    else if (act === "credit") { document.getElementById("s-paid").value = "0"; updateRest(); }
    else if (act === "savephone") {
      var c = client(id); c.phone = document.getElementById("c-phone").value.trim(); save(); clientSheet(id); render(); toast("Numéro enregistré");
    } else if (act === "saveclient") {
      var nm = document.getElementById("n-name").value.trim();
      if (!nm) { document.getElementById("n-err").textContent = "Écris le nom du client."; return; }
      state.clients.push({ id: uid(), name: nm, phone: document.getElementById("n-phone").value.trim() });
      save(); closeSheet(); render(); toast("Client ajouté");
    } else if (act === "clear") { state = { demo: false, clients: [], tx: [], products: [], moves: [], settings: state.settings || { shop: "", template: "" } }; save(); render(); toast("Cahier vide, à toi de jouer"); }
  });
  document.addEventListener("input", function (e) {
    var id = e.target.id;
    if (id === "q") { query = e.target.value; var pos = e.target.selectionStart; render(); var q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
    if (id === "s-total" || id === "s-paid") { updateRest(); }
    if (id === "pay-from") updatePaid();
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "s-client") document.getElementById("s-new").hidden = e.target.value !== "__new";
    if (e.target.id === "m-prod") document.getElementById("m-new").hidden = e.target.value !== "__new";
    if (e.target.id === "s-prod") document.getElementById("s-pq").hidden = !e.target.value;
    if (e.target.id === "pay-via") updatePaid();
    if (e.target.id === "cn-file" && e.target.files && e.target.files[0]) { var fc = new FileReader(); fc.onload = function () { cnPreview(cnAnalyse(fc.result)); }; fc.onerror = function () { var er = document.getElementById("cn-err"); if (er) er.textContent = "Impossible de lire ce fichier."; }; fc.readAsText(e.target.files[0]); }
    if (e.target.id === "bk-file" && e.target.files && e.target.files[0]) { var fr = new FileReader(); fr.onload = function () { var ta = document.getElementById("bk-in"); if (ta) ta.value = String(fr.result || ""); }; fr.readAsText(e.target.files[0]); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  save();
  autoSnap();
  syncAutoMessages();
  render();
  initLang();
  applyTheme();
  maybeWarn();
  fetchFeed();
  setInterval(tick, 1000);
  setNet();
  window.addEventListener("online", setNet); window.addEventListener("offline", setNet);
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (pinData && !pinLocked && hiddenAt && Date.now() - hiddenAt > 60000) { pinLocked = true; pinBuf = ""; closeSheet(); render(); }
    autoSnap(); tick(); maybeWarn(); if (Date.now() - lastFetch > 600000) fetchFeed();
    if (appVisible() && view === "today" && document.getElementById("overlay").innerHTML === "") render();
  });
})();
</script>

</body>
</html>
